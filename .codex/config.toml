# Project-local settings. No global configuration or paid API provider.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"

# Launch Codex from the repository root. REA is optional local development tooling.
[mcp_servers.rea]
command = "node"
args = ["scripts/rea-launch.mjs", "mcp"]
cwd = "."
startup_timeout_sec = 30
tool_timeout_sec = 450
